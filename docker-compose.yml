# =============================================================================
# eRTMAC-NWIS Production Docker Compose — Phase 09 Hardened Configuration
# =============================================================================
# DEPLOYMENT MODES:
#   Development:  docker compose up (uses defaults below)
#   Production:   docker compose --env-file .env.production up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL + PostGIS (Primary Data Store)
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: ertmac_nwis_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nwis_db}
      POSTGRES_USER: ${POSTGRES_USER:-nwis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
      # Performance tuning for drilling telemetry workloads
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/schema_postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nwis_user} -d ${POSTGRES_DB:-nwis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Resource limits for predictable performance
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    # Security: Drop all capabilities, add back only what's needed
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem where possible
    tmpfs:
      - /tmp
      - /run

  # ---------------------------------------------------------------------------
  # Redis (Session Cache & Pub/Sub for Real-Time Telemetry)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ertmac_nwis_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-nwis_redis_dev}
      --rename-command FLUSHALL ""
      --rename-command CONFIG ""
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nwis_redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # NWIS Backend Application Server
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ertmac_nwis_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-nwis_user}:${POSTGRES_PASSWORD:-CHANGE_ME_IN_PRODUCTION}@db:5432/${POSTGRES_DB:-nwis_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-nwis_redis_dev}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-MUST_CHANGE_IN_PRODUCTION}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://nwis.oilindia.in}
      - DEBUG=false
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - nwis_logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
        reservations:
          memory: 1G
    security_opt:
      - no-new-privileges:true
    # Don't expose more than necessary
    read_only: false  # Needs write access to data/ and logs/
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:
    name: ertmac_nwis_postgres_data
  redis_data:
    name: ertmac_nwis_redis_data
  nwis_logs:
    name: ertmac_nwis_logs
